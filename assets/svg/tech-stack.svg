<svg viewBox="0 0 1200 670" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tech stack of Emmraan. Frontend: React, Next.js, TypeScript, JavaScript, HTML5, TailwindCSS, Vite, Redux, Remix, EJS. Backend: Node.js, Express.js, FastAPI, Django, Python, Socket.io. Databases and Storage: MongoDB, PostgreSQL, MySQL, Redis, Appwrite, Firebase. Cloud and DevOps: AWS, Azure, Google Cloud, DigitalOcean, Linode, Docker, Nginx, Apache. AI and ML and Data Science: TensorFlow, PyTorch, Pandas, NumPy, CUDA. Tools and Platforms: Git, GitHub, NPM, Yarn, PNPM, Postman, Figma, Notion, ESLint, Babel." preserveAspectRatio="xMidYMid meet">
