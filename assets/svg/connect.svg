<svg viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Let's connect. Emmraan is always excited to collaborate on interesting projects. Reach out on LinkedIn at md-emran-79302b2b1 or Instagram at https.aatsan.ig." preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="cnBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#161B22"/>
    </linearGradient>
    <linearGradient id="cnAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D9FF"/>
      <stop offset="50%" stop-color="#FF00FF"/>
      <stop offset="100%" stop-color="#FFD700"/>
    </linearGradient>
    <pattern id="cnGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#00D9FF" stroke-width="0.4"/>
    </pattern>
  </defs>

  <rect width="1200" height="260" fill="url(#cnBg)"/>
  <rect width="1200" height="260" fill="url(#cnGrid)" opacity="0.07"/>

  <!-- Header -->
  <g>
    <text x="40" y="48" font-family="Fira Code, monospace" font-size="13" letter-spacing="3" fill="#FFD700">// LET'S CONNECT</text>
    <line x1="200" y1="43" x2="1160" y2="43" stroke="url(#cnAccent)" stroke-opacity="0.5" stroke-width="1.5"/>
  </g>

  <!-- LinkedIn card -->
  <g>
    <rect x="40" y="75" width="355" height="150" rx="16" fill="#161B22" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
    <rect x="40" y="75" width="355" height="150" rx="16" fill="none" stroke="#00D9FF" stroke-width="1.5" opacity="0.5">
      <animate attributeName="opacity" values="0.15;0.6;0.15" dur="4s" repeatCount="indefinite"/>
    </rect>
    <circle cx="95" cy="140" r="28" fill="#0A66C2"/>
    <text x="95" y="149" font-family="Segoe UI, sans-serif" font-size="30" font-weight="bold" text-anchor="middle" fill="#ffffff">in</text>
    <text x="140" y="132" font-family="Segoe UI, sans-serif" font-size="18" font-weight="bold" fill="#e6edf3">LinkedIn</text>
    <text x="140" y="156" font-family="Fira Code, monospace" font-size="13" fill="#8b949e">/in/md-emran-79302b2b1</text>
    <rect x="60" y="182" width="150" height="30" rx="15" fill="#00D9FF" fill-opacity="0.12" stroke="#00D9FF" stroke-opacity="0.6" stroke-width="1"/>
    <text x="135" y="202" font-family="Segoe UI, sans-serif" font-size="13" text-anchor="middle" fill="#00D9FF">Connect →</text>
  </g>

  <!-- Instagram card -->
  <g>
    <rect x="422" y="75" width="355" height="150" rx="16" fill="#161B22" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
    <rect x="422" y="75" width="355" height="150" rx="16" fill="none" stroke="#FF00FF" stroke-width="1.5" opacity="0.5">
      <animate attributeName="opacity" values="0.15;0.6;0.15" dur="4s" begin="1.2s" repeatCount="indefinite"/>
    </rect>
    <circle cx="477" cy="140" r="28" fill="none" stroke="url(#cnAccent)" stroke-width="4"/>
    <circle cx="477" cy="140" r="10" fill="none" stroke="url(#cnAccent)" stroke-width="3"/>
    <circle cx="477" cy="128" r="3.5" fill="#FF00FF"/>
    <text x="522" y="132" font-family="Segoe UI, sans-serif" font-size="18" font-weight="bold" fill="#e6edf3">Instagram</text>
    <text x="522" y="156" font-family="Fira Code, monospace" font-size="13" fill="#8b949e">@https.aatsan.ig</text>
    <rect x="442" y="182" width="150" height="30" rx="15" fill="#FF00FF" fill-opacity="0.12" stroke="#FF00FF" stroke-opacity="0.6" stroke-width="1"/>
    <text x="517" y="202" font-family="Segoe UI, sans-serif" font-size="13" text-anchor="middle" fill="#FF00FF">Follow →</text>
  </g>

  <!-- GitHub card -->
  <g>
    <rect x="804" y="75" width="355" height="150" rx="16" fill="#161B22" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
    <rect x="804" y="75" width="355" height="150" rx="16" fill="none" stroke="#FFD700" stroke-width="1.5" opacity="0.5">
      <animate attributeName="opacity" values="0.15;0.6;0.15" dur="4s" begin="2.4s" repeatCount="indefinite"/>
    </rect>
    <circle cx="859" cy="140" r="28" fill="#0D1117" stroke="#FFD700" stroke-width="2.5"/>
    <text x="859" y="150" font-family="Fira Code, monospace" font-size="22" font-weight="bold" text-anchor="middle" fill="#FFD700">&lt;/&gt;</text>
    <text x="904" y="132" font-family="Segoe UI, sans-serif" font-size="18" font-weight="bold" fill="#e6edf3">GitHub</text>
    <text x="904" y="156" font-family="Fira Code, monospace" font-size="13" fill="#8b949e">/Emmraan</text>
    <rect x="824" y="182" width="150" height="30" rx="15" fill="#FFD700" fill-opacity="0.12" stroke="#FFD700" stroke-opacity="0.6" stroke-width="1"/>
    <text x="899" y="202" font-family="Segoe UI, sans-serif" font-size="13" text-anchor="middle" fill="#FFD700">View →</text>
  </g>
</svg>
