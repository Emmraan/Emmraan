<svg viewBox="0 0 1200 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Contribution distribution for Emmraan, a live GitHub activity graph showing contribution density over time." preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="cdBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#161B22"/>
    </linearGradient>
    <linearGradient id="cdAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D9FF"/>
      <stop offset="50%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FF00FF"/>
    </linearGradient>
    <radialGradient id="cdGlow" cx="50%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>
    <pattern id="cdGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#00D9FF" stroke-width="0.4"/>
    </pattern>
  </defs>

  <rect width="1200" height="480" fill="url(#cdBg)"/>
  <rect width="1200" height="480" fill="url(#cdGrid)" opacity="0.07"/>
  <rect width="1200" height="480" fill="url(#cdGlow)"/>

  <!-- Header -->
  <g>
    <text x="40" y="48" font-family="Fira Code, monospace" font-size="13" letter-spacing="3" fill="#FFD700">// CONTRIBUTION DISTRIBUTION</text>
    <line x1="330" y1="43" x2="1160" y2="43" stroke="url(#cdAccent)" stroke-opacity="0.5" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="0.3;0.7;0.3" dur="4s" begin="1.5s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Card frame -->
  <rect x="60" y="80" width="1080" height="360" rx="16" fill="#161B22" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
  <rect x="60" y="80" width="1080" height="360" rx="16" fill="none" stroke="#FFD700" stroke-width="1.5" opacity="0.4">
    <animate attributeName="opacity" values="0.15;0.6;0.15" dur="5s" begin="1.5s" repeatCount="indefinite"/>
  </rect>
  <rect x="60" y="80" width="1080" height="4" rx="2" fill="url(#cdAccent)"/>

  <!-- Live activity graph image -->
  <image href="https://github-readme-activity-graph.vercel.app/graph?username=Emmraan&amp;custom_title=Contribution%20Graph&amp;bg_color=0D1117&amp;color=00D9FF&amp;line=FF00FF&amp;point=FFD700&amp;area_color=0D1117&amp;hide_border=true"
         x="100" y="110" width="1000" height="300" preserveAspectRatio="xMidYMid meet"/>
</svg>
