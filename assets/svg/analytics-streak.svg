<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GitHub streak statistics for Emmraan showing current streak, longest streak and total contributions." preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="asBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#161B22"/>
    </linearGradient>
    <linearGradient id="asAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="50%" stop-color="#00D9FF"/>
      <stop offset="100%" stop-color="#FF00FF"/>
    </linearGradient>
    <pattern id="asGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#00D9FF" stroke-width="0.4"/>
    </pattern>
  </defs>

  <rect width="1200" height="400" fill="url(#asBg)"/>
  <rect width="1200" height="400" fill="url(#asGrid)" opacity="0.07"/>

  <!-- Header -->
  <g>
    <text x="40" y="48" font-family="Fira Code, monospace" font-size="13" letter-spacing="3" fill="#FFD700">// STREAK STATS</text>
    <line x1="180" y1="43" x2="1160" y2="43" stroke="url(#asAccent)" stroke-opacity="0.5" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="0.3;0.7;0.3" dur="4s" begin="2s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Card frame -->
  <rect x="60" y="75" width="1080" height="290" rx="16" fill="#161B22" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
  <rect x="60" y="75" width="1080" height="290" rx="16" fill="none" stroke="#FFD700" stroke-width="1.5" opacity="0.4">
    <animate attributeName="opacity" values="0.15;0.6;0.15" dur="5s" begin="2s" repeatCount="indefinite"/>
  </rect>
  <rect x="60" y="75" width="1080" height="4" rx="2" fill="url(#asAccent)"/>

  <!-- Live streak image -->
  <image href="https://streak-stats.demolab.com?user=Emmraan&amp;theme=tokyonight&amp;hide_border=true&amp;background=0D1117&amp;stroke=00D9FF&amp;ring=FF00FF&amp;fire=FFD700&amp;currStreakNum=FFFFFF&amp;sideNums=FFFFFF&amp;currStreakLabel=00D9FF&amp;sideLabels=FF00FF"
         x="240" y="105" width="720" height="230" preserveAspectRatio="xMidYMid meet"/>
</svg>
